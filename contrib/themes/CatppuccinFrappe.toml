# Catppuccin Frappe
#
# Part of the Catppuccin family: Latte, Frappe, Macchiato, Mocha.
# Palette: https://github.com/catppuccin/catppuccin
#   Mauve #ca9ee6 (keys) — Overlay 0 #737994 (separator) — Base #303446

spacing         = 1
padding         = 0
separator       = "›"
key_color       = "#ca9ee6"
separator_color = "#737994"

[box]
title           = "Catppuccin Frappe"
border          = "rounded"
visible         = true

[box.inner_margin]
x               = 1
y               = 0

[palette]
type            = "Full"
glyph           = "● "
spacing         = 2
visible         = true

[bar]
glyph           = "■"
symbol_open     = '['
symbol_close    = ']'
hide_delimiters = false
visible         = true
